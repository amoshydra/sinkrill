name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Build
        env:
          GOOS: linux
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION#v}" \
            -o thrum-linux-${{ matrix.arch }} .
          sha256sum thrum-linux-${{ matrix.arch }} \
            > thrum-linux-${{ matrix.arch }}.sha256

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            thrum-linux-${{ matrix.arch }}
            thrum-linux-${{ matrix.arch }}.sha256
