name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      # Tags created by GITHUB_TOKEN do not trigger other workflows, so the
      # binaries are built and attached in this same run.
      - name: Build binaries
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for arch in amd64 arm64; do
            GOOS=linux GOARCH="$arch" CGO_ENABLED=0 \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" \
              -o "sinkrill-linux-$arch" .
            sha256sum "sinkrill-linux-$arch" > "sinkrill-linux-$arch.sha256"
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            sinkrill-linux-amd64
            sinkrill-linux-amd64.sha256
            sinkrill-linux-arm64
            sinkrill-linux-arm64.sha256
